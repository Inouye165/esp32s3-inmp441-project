<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32-S3 INMP441 Streamer</title>
  <link rel="stylesheet" href="lib/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3">
  <span class="navbar-brand fw-semibold">
    <span class="text-success">&#9679;</span>&nbsp;ESP32-S3 INMP441 Streamer
  </span>
  <div class="d-flex gap-2 align-items-center">
    <span class="text-secondary small">Board:</span>
    <span id="board-status" class="badge bg-secondary">unknown</span>
    <span class="text-secondary small ms-3">Ingest:</span>
    <span id="ingest-status" class="badge bg-secondary">unknown</span>
  </div>
</nav>

<div class="container-fluid py-3 px-4">

  <!-- ESP32 connection -->
  <div class="card border-secondary mb-3">
    <div class="card-body py-2 d-flex align-items-center gap-2 flex-wrap">
      <label class="text-secondary small mb-0">ESP32 IP</label>
      <input id="esp32-ip-input" type="text" class="form-control form-control-sm w-auto" placeholder="192.168.1.50" />
      <label class="text-secondary small mb-0 ms-2">Port</label>
      <input id="esp32-port-input" type="number" class="form-control form-control-sm w-auto" value="80" />
      <button id="save-config-btn" class="btn btn-sm btn-primary">Save</button>
      <span id="config-msg" class="text-secondary small ms-2"></span>
    </div>
  </div>

  <div class="row g-3">
    <!-- Board info -->
    <div class="col-md-4">
      <div class="card border-secondary h-100">
        <div class="card-header py-2">Board Info</div>
        <div class="card-body small">
          <div>Chip: <span id="info-chip" class="text-info">—</span></div>
          <div>Firmware: <span id="info-fw" class="text-info">—</span></div>
          <div>IP: <span id="info-ip" class="text-info">—</span></div>
          <div>RSSI: <span id="info-rssi" class="text-info">—</span> dBm</div>
          <div>Streaming: <span id="info-streaming" class="text-info">—</span></div>
          <div>Sample rate: <span id="info-sr" class="text-info">—</span> Hz</div>
        </div>
      </div>
    </div>

    <!-- Level -->
    <div class="col-md-4">
      <div class="card border-secondary h-100">
        <div class="card-header py-2">Current Level</div>
        <div class="card-body text-center">
          <div class="display-5 fw-bold" id="level-value">—</div>
          <div class="text-secondary small">dBFS (RMS, 1 s window)</div>
        </div>
      </div>
    </div>

    <!-- Stream controls -->
    <div class="col-md-4">
      <div class="card border-secondary h-100">
        <div class="card-header py-2">Stream Listener</div>
        <div class="card-body">
          <div class="d-grid gap-2">
            <button id="start-btn" class="btn btn-success btn-sm">Start listener</button>
            <button id="stop-btn" class="btn btn-outline-danger btn-sm">Stop listener</button>
          </div>
          <div class="small text-secondary mt-2">
            Port: <span id="ingest-port">—</span><br />
            Client: <span id="ingest-client">none</span><br />
            Bytes: <span id="ingest-bytes">0</span>
          </div>
          <div id="stream-msg" class="small text-warning mt-2"></div>
        </div>
      </div>
    </div>

    <!-- Waveform -->
    <div class="col-12">
      <div class="card border-secondary">
        <div class="card-header py-2">Live Waveform (dBFS)</div>
        <div class="card-body">
          <canvas id="wave-chart" height="120"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="lib/bootstrap.bundle.min.js"></script>
<script src="lib/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
