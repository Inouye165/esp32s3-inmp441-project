; PlatformIO Project Configuration
; Board: ESP32-S3-DevKitC-1 (CP210x USB bridge on COM4)
; Microphone: INMP441 via I2S

[platformio]
default_envs = esp32s3_devkit

[env:esp32s3_devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1 N16R8 = 16 MB flash + 8 MB octal PSRAM
board_build.flash_size  = 16MB
board_build.psram_type  = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Use native USB-CDC for Serial so the on-board USB port also works as monitor.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Increase upload speed
upload_speed = 921600
