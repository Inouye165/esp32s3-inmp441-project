; PlatformIO Project Configuration
; Unit 1: ESP32-S3-WROOM-1 (COM6)        — env:esp32s3_devkit
; Unit 2: Classic ESP32-D0WD DevKit (COM3)— env:esp32_audio_source

[platformio]
default_envs = esp32s3_devkit

[env:esp32s3_devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1 N16R8 = 16 MB flash + 8 MB octal PSRAM
board_build.flash_size  = 16MB
board_build.psram_type  = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

upload_port = COM6
monitor_port = COM6
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Use native USB-CDC for Serial so the on-board USB port also works as monitor.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Increase upload speed
upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; Unit 2 — Classic ESP32 (ESP32-D0WD / DevKit V1) on COM3
;   INMP441 wiring:  SCK→GPIO26  WS→GPIO25  SD→GPIO34  L/R→GND
;   TCP stream:  server:8002 (raw int16 PCM, 16 kHz mono)
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32_audio_source]
platform = espressif32
board = esp32dev
framework = arduino

; src_dir is project-level only; use build_src_filter + -I to isolate sources
build_src_filter = -<*> +<../src_esp32classic/*>

upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 115200

board_build.flash_size = 2MB
board_build.flash_mode = dio
board_upload.flash_size = 2MB

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I ${PROJECT_DIR}/src_esp32classic

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
