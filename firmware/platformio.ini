; PlatformIO Project Configuration
; Board: ESP32-S3-DevKitC-1 (CP210x USB bridge on COM4)
; Microphone: INMP441 via I2S

[platformio]
default_envs = esp32s3_devkit

[env:esp32s3_devkit]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = COM4
monitor_port = COM4
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Increase upload speed
upload_speed = 921600
